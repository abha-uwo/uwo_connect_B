# ==============================================================================
# Google Cloud Build Pipeline - Deploy UWOConnect to GCP Cloud Run
# ==============================================================================

steps:
  # 1. Build Backend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/uwoconnect-backend:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/uwoconnect-backend:latest', './UWO_CONNECT_B']

  # 2. Build Frontend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'NEXT_PUBLIC_API_URL=https://uwoconnectforrb-743928421487.asia-south1.run.app', '-t', 'gcr.io/$PROJECT_ID/uwoconnect-frontend:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/uwoconnect-frontend:latest', './UWO_CONECT_F-']

  # 3. Push Backend Image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/uwoconnect-backend:latest']

  # 4. Push Frontend Image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/uwoconnect-frontend:latest']

  # 5. Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'uwoconnect-backend'
      - '--image=gcr.io/$PROJECT_ID/uwoconnect-backend:latest'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'

  # 6. Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'uwoconnect-frontend'
      - '--image=gcr.io/$PROJECT_ID/uwoconnect-frontend:latest'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'

images:
  - 'gcr.io/$PROJECT_ID/uwoconnect-backend:latest'
  - 'gcr.io/$PROJECT_ID/uwoconnect-frontend:latest'
